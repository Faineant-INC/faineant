name: Production QA UI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-qa-ui
  cancel-in-progress: false

jobs:
  chromium:
    name: Read-only account journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-qa
    env:
      E2E_BASE_URL: https://faineantapp.com
      QA_CLIENT_PASSWORD: ${{ secrets.QA_CLIENT_PASSWORD }}
      QA_UNVERIFIED_PASSWORD: ${{ secrets.QA_UNVERIFIED_PASSWORD }}
      QA_DISABLED_PASSWORD: ${{ secrets.QA_DISABLED_PASSWORD }}
      QA_PROVIDER_PASSWORD: ${{ secrets.QA_PROVIDER_PASSWORD }}
      QA_PROVIDER_PENDING_PASSWORD: ${{ secrets.QA_PROVIDER_PENDING_PASSWORD }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faineant/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

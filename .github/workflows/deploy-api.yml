name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faineant
          POSTGRES_PASSWORD: faineant_test
          POSTGRES_DB: faineant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @faineant/shared build

      - name: Generate Prisma client
        run: pnpm --filter @faineant/api exec prisma generate

      - name: Apply migrations to CI Postgres
        run: pnpm --filter @faineant/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://faineant:faineant_test@localhost:5432/faineant_test?schema=public

      - name: Typecheck
        run: pnpm --filter @faineant/api run typecheck

      - name: Test
        run: pnpm --filter @faineant/api run test
        env:
          DATABASE_URL: postgresql://faineant:faineant_test@localhost:5432/faineant_test?schema=public
          JWT_SECRET: test-jwt-secret-minimum16chars
          JWT_REFRESH_SECRET: test-refresh-secret-minimum16chars
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NODE_ENV: test

      - name: Build API
        run: pnpm --filter @faineant/api build

  deploy:
    name: Trigger Render deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set — skipping deploy trigger."
            echo "Set it in repo settings → Secrets and variables → Actions."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl --fail-with-body -sS -X POST "$RENDER_DEPLOY_HOOK"
          echo ""
          echo "Render deploy triggered. Migrations run via render.yaml preDeployCommand."

      - name: Verify deploy (poll /health)
        if: env.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          echo "Polling $API_HEALTH_URL for up to 5 minutes..."
          for i in $(seq 1 30); do
            if curl --fail -sS "$API_HEALTH_URL" | grep -q '"db":"ok"'; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i — not ready yet, sleeping 10s..."
            sleep 10
          done
          echo "::warning::Health check did not pass within 5 minutes; check Render logs."

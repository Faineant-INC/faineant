name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faineant/shared build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Build applications
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key

  database:
    name: Supabase migrations and policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Lint application schema
        run: supabase db lint --local --schema public --level warning --fail-on warning

      - name: Check generated database types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u packages/shared/src/database.types.ts /tmp/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

      - name: Test Edge Functions
        run: deno test --allow-env --node-modules-dir=auto supabase/functions

name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Build Vercel web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faineant/shared build
      - run: pnpm --filter @faineant/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_LAUNCH_MODE: ${{ vars.NEXT_PUBLIC_LAUNCH_MODE }}

      # Vercel owns deployment after its GitHub app is connected to the Faineant org.
